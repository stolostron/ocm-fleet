name: Published Quay AIO sanity

# Sanity only: pull already-published quay.io/stolostron/ocm-fleet:latest,
# confirm it starts, Dex login works, and the console masthead/Clusters render.
# Not a re-run of the full UI suite (Kind journey, a11y, etc.); that is e2e.yml
# against this checkout's image.
#
# A failure is a live product incident: end users podman-run this tag. It does
# not mean the current PR/branch is broken. Investigate :latest immediately.
#
# OpenShift CI tags :latest on merge and republishes it at
# 02:30/08:30/14:30/20:30 UTC; check nightly after the first republish.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keep successful commands silent; replay complete diagnostics on failure.
defaults:
  run:
    shell: bash tools/ci-output.sh {0}

jobs:
  e2e-published:
    name: Published Quay AIO sanity (not this branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: published

      - name: Run UI sanity against the published image
        env:
          OCM_FLEET_E2E_AIO_PULL: "1"
          LOG_LEVEL: debug
          NX_DAEMON: "false"
        run: npx nx test:e2e e2e-web -- --project=chromium-sanity

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-published-test-results
          path: |
            e2e/web/test-results/
            e2e/web/playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Failure is published AIO sanity, not this branch
        shell: bash
        if: ${{ failure() }}
        run: |
          cat <<'EOF'
          Sanity failed against quay.io/stolostron/ocm-fleet:latest (already
          published). The image did not start, Dex login failed, or the console
          did not show a logged-in session. That is not a verdict on this branch.

          Investigate ASAP: users podman-run this tag. Confirm
          `podman run quay.io/stolostron/ocm-fleet:latest`, check OpenShift CI
          image-mirror / republish jobs, and restore a working :latest.
          See docs/testing/end-to-end.md (GitHub Actions).
          EOF

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.job }}
          path: ${{ runner.temp }}/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
