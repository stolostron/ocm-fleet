name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Keep successful commands silent; replay complete diagnostics on failure.
defaults:
  run:
    shell: bash tools/ci-output.sh {0}

jobs:
  # Single cache writer. Test jobs restore the same multi-image tar and do
  # not race this key. Kind host setup (user podman.socket, kind network) lives
  # in setup-e2e for the Playwright matrix. Matrix entries do not share a
  # container.
  aio-image:
    name: AIO image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: cache

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Stable merge requirement: skipped/cancelled matrix jobs must not pass.
  e2e:
    name: E2E
    if: ${{ always() }}
    needs: [aio-image, e2e-playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require the image and both E2E suites
        shell: bash
        env:
          IMAGE_RESULT: ${{ needs.aio-image.result }}
          TEST_RESULT: ${{ needs.e2e-playwright.result }}
        run: |
          if [[ "$IMAGE_RESULT" != success || "$TEST_RESULT" != success ]]; then
            echo "::error::E2E did not pass: image=$IMAGE_RESULT suites=$TEST_RESULT"
            exit 1
          fi

  e2e-playwright:
    name: E2E (${{ matrix.name }})
    needs: [aio-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UI
            project: e2e-web
            arguments: "-- --project=chromium"
            artifact_name: e2e-test-results
            artifact_paths: |
              e2e/web/test-results/
              e2e/web/playwright-report/
          - name: CLI
            project: e2e-cli
            arguments: ""
            artifact_name: e2e-cli-test-results
            artifact_paths: e2e/cli/test-results/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: e2e

      - name: Run ${{ matrix.name }} e2e tests
        env:
          OCM_FLEET_E2E_AIO_PREBUILT: "1"
          LOG_LEVEL: debug
          NX_DAEMON: "false"
        run: npx nx test:e2e ${{ matrix.project }} ${{ matrix.arguments }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
