name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 14 * * 1"

# Keep successful commands silent; replay complete diagnostics on failure.
defaults:
  run:
    shell: bash tools/ci-output.sh {0}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Scan source by default, including tooling and local actions, so new
          # directories stay covered. Go coverage comes from the builds below.
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - poc

      - name: Build all Go modules
        if: matrix.language == 'go'
        run: |
          set -euo pipefail
          # Test fixtures are exercised by their tests, not standalone builds.
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "Building $dir..."
            (cd "$dir" && go build ./...)
          done < <(find . -name go.mod -not -path '*/vendor/*' -not -path '*/testdata/*' -not -path './poc/*' | sort)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Upload failure logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
