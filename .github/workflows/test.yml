name: Quality and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TESTCONTAINERS_PROVIDER: docker
  NX_DAEMON: "false"
  GOTESTSUM_FORMAT: github-actions

jobs:
  quality:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Optional, read-only reuse of the existing HTTP cache. Forks and an
      # unconfigured repository run the same checks with local caching only.
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_READ_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/golangci-lint/go.mod
          cache: true
          cache-dependency-path: |
            tools/golangci-lint/go.sum
            server/go.sum
            deploy/aio/go.sum
            sdk/nx-cache-proxy/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.75.0"

      # Native analysis entries validate their own source/configuration hashes;
      # restoring an older archive still helps on partially changed modules.
      - name: Cache Go lint analysis
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/golangci-lint-cache
          key: golangci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/golangci-lint/**', 'tools/golangci-lint.mjs') }}-${{ github.sha }}
          restore-keys: |
            golangci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/golangci-lint/**', 'tools/golangci-lint.mjs') }}-

      - name: Install component-test browser
        run: npx playwright install --with-deps chromium

      # One task graph shares setup and collects every project's supported
      # checks. CI checks source as submitted; local verify/fix handle rewrites.
      - name: Check workspace
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        run: npx nx run ocm-fleet:check --parallel=3 --nxBail=false

      - name: Check repository files stayed unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Detect Docker host address for kind OIDC tests
        run: echo "KIND_HOST_ADDR=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npx nx run server:test-integration

  # Require this stable check in branch protection. Explicit result checks keep
  # a skipped or failed dependency from becoming a successful merge gate.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.integration.result }}" = success
