apiVersion: v1
kind: Service
metadata:
  name: resource-manager
spec:
  type: NodePort
  selector:
    app: resource-manager
  ports:
    - name: http
      port: 8085
      targetPort: http
      nodePort: 30085
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      nodePort: 30051
      protocol: TCP
      appProtocol: kubernetes.io/h2c
