apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-record-controller
  namespace: fleet-record-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-record-controller
  namespace: fleet-record-demo
rules:
  - apiGroups: [records.open-cluster-management.io]
    resources: [fleetrecords]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [records.open-cluster-management.io]
    resources: [fleetrecords/status, fleetrecords/finalizers]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-record-controller
  namespace: fleet-record-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-record-controller
subjects:
  - kind: ServiceAccount
    name: fleet-record-controller
    namespace: fleet-record-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-record-leader
  namespace: fleet-record-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-record-leader
  namespace: fleet-record-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-record-leader
subjects:
  - kind: ServiceAccount
    name: fleet-record-controller
    namespace: fleet-record-system
